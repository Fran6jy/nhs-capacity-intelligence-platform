[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --cov=src --cov-report=term-missing --cov-fail-under=60"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

# Type-checking is ENFORCED in CI (no `|| true`). These modules predate that
# and still have known errors; the list is a ratchet — it may shrink, never
# grow. Clearing an entry means deleting it here, not adding an ignore comment.
[[tool.mypy.overrides]]
module = [
    "src.models.bed_occupancy",
    "src.models.waiting_time",
    "src.models.validation",
    "src.llm.recommender",
    "src.llm.agents",
]
ignore_errors = true
